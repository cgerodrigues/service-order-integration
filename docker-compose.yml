services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${INBOUND_TOPIC}" --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${SUCCESS_TOPIC}" --partitions 3 --replication-factor 1
    environment:
      INBOUND_TOPIC: ${SERVICE_ORDER_CREATED_TOPIC:-service-order.created}
      SUCCESS_TOPIC: ${SERVICE_ORDER_SYNCHRONIZED_TOPIC:-service-order.synchronized}
  field-service:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./dev/wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating"]
  otel-collector:
    image: otel/opentelemetry-collector:0.147.0
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./dev/otel-collector.yaml:/etc/otelcol/config.yaml:ro
